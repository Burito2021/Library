plugins {
    id "java"
    id "org.springframework.boot" version "3.5.16"
    id "io.spring.dependency-management" version "1.1.6"
}

group = "net.library"
version = "1.0.0"

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

sourceSets {
    test {
        java {
            srcDirs = ["src/test/java"]
        }
    }
}

repositories {
    mavenCentral()
}

/**
 * Known vulnerabilities that remain after upgrading to Spring Boot 3.5.16 (OSV scan, versions from runtimeClasspath).
 * <ul>
 *   <li>org.springframework:spring-webmvc 6.2.19 - CVE-2026-47890 (SSE stream corruption with view fragments) and
 *       CVE-2026-47884 (XsltView SSRF/RCE), both critical. No fix exists in the 6.x line, only in Spring Framework
 *       7.0.9. The application uses neither SSE, view fragments nor XsltView, so it is not exposed. Resolve by moving
 *       to Spring Boot 4 / Spring Framework 7.</li>
 *   <li>com.github.ulisesbocchio:jasypt-spring-boot-starter 3.0.5 - 1 low severity finding (GHSA-jgj7-c8vj-w563).</li>
 *   <li>org.apache.commons:commons-lang3 3.17.0 - 1 moderate finding (GHSA-j288-q9x7-2f5v), transitive.</li>
 *   <li>org.apache.logging.log4j:log4j-api 2.24.3 - 1 moderate finding (GHSA-qv9r-c865-cp47), transitive.</li>
 * </ul>
 * The jackson-bom, netty and tomcat versions are overridden in gradle.properties because the Spring Boot BOM
 * does not yet include the fixed releases. Remove the overrides once the BOM catches up.
 */
dependencies {
    // Spring Boot
    implementation "org.springframework.boot:spring-boot-starter-web"
    implementation "org.springframework.boot:spring-boot-starter-data-jpa"
    implementation "org.springframework.boot:spring-boot-starter-data-redis"
    implementation "org.springframework.boot:spring-boot-starter-hateoas"
    implementation "org.springframework.boot:spring-boot-starter-security"
    implementation "org.springframework.boot:spring-boot-starter-actuator"
    implementation "org.springframework.boot:spring-boot-autoconfigure"

    // Database
    implementation "org.postgresql:postgresql"

    // Validation and Jackson
    implementation "org.hibernate.validator:hibernate-validator:${hibernate}"
    implementation "com.fasterxml.jackson.core:jackson-databind"
    implementation "com.fasterxml.jackson.core:jackson-core"
    implementation "com.fasterxml.jackson.core:jackson-annotations"

    // Security
    implementation "io.jsonwebtoken:jjwt-api:${jsonwebtoken}"
    runtimeOnly "io.jsonwebtoken:jjwt-impl:${jsonwebtoken}"
    runtimeOnly "io.jsonwebtoken:jjwt-jackson:${jsonwebtoken}"
    implementation "com.github.ulisesbocchio:jasypt-spring-boot-starter:${jasypt}"

    // API docs and monitoring
    implementation "org.springdoc:springdoc-openapi-starter-webmvc-ui:${springdoc}"
    implementation "io.micrometer:micrometer-registry-prometheus"

    // Jakarta and annotations
    implementation "jakarta.annotation:jakarta.annotation-api:${javax}"
    implementation "jakarta.servlet:jakarta.servlet-api:${servlet}"
    implementation "com.google.code.findbugs:jsr305:${findbugs}"

    // Code generation
    implementation "org.mapstruct:mapstruct:${mapstruct}"
    compileOnly "org.projectlombok:lombok:${lombok}"
    annotationProcessor "org.projectlombok:lombok:${lombok}"
    annotationProcessor "org.projectlombok:lombok-mapstruct-binding:${lombokmapstruct}"
    annotationProcessor "org.mapstruct:mapstruct-processor:${mapstruct}"

    // Test
    testImplementation "org.springframework.boot:spring-boot-starter-test"
    testImplementation "org.springframework.security:spring-security-test"
    testImplementation "org.springframework.boot:spring-boot-testcontainers:${springbootcontainer}"
    testImplementation "org.testcontainers:testcontainers"
    testImplementation "org.testcontainers:junit-jupiter:${junittestcontainer}"
    testImplementation "org.testcontainers:postgresql:${testcontainerspostgresql}"
    testImplementation "org.junit.jupiter:junit-jupiter:${junit}"
    testImplementation "org.hamcrest:hamcrest:${hamcrest}"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}

tasks.named("test") {
    useJUnitPlatform()
    systemProperty "DOCKER_API_VERSION", "1.51"
    environment "DOCKER_API_VERSION", "1.51"
}
